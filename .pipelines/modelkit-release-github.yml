name: $(BuildDefinitionName)_$(date:yyMM).$(date:dd)$(rev:rrr)

trigger: none

parameters:
- name: OFFICIAL_BUILD_ID
  displayName: 'Specify which official build run to use (pipeline build ID)'
  type: string

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      isCustom: true
      name: 'ProjectReunionESPool-2022'
      # Need a clone of MMS2022 with artifact windows-1es-pt-prerequisites-v2 installed to satisfy 1ESPT.
      # https://eng.ms/docs/cloud-ai-platform/devdiv/one-engineering-system-1es/1es-docs/1es-pipeline-templates/onboardingesteams/create-agent-image
      demands: ImageOverride -equals MMS2022-1ES-GPT
    stages:
    - stage: Release
      displayName: 'Release to GitHub'
      condition: startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')
      jobs:
      - job: Prepare
        displayName: 'Prepare GitHub Release Assets'
        templateContext:
          outputs:
          - output: pipelineArtifact
            displayName: 'Publish staged release assets'
            targetPath: $(Build.SourcesDirectory)/release_assets
            artifactName: GitHubReleaseAssets

        steps:
        - task: DownloadPipelineArtifact@2
          displayName: 'Download official build artifacts'
          inputs:
            buildType: 'specific'
            project: '320d2220-0d58-42de-ae76-6f774e8e5eef'
            definition: '191314'
            buildVersionToDownload: 'specific'
            pipelineId: ${{ parameters.OFFICIAL_BUILD_ID }}
            targetPath: '$(Build.SourcesDirectory)/official_build'

        - template: templates/stage-windows-wheels.yml
          parameters:
            destination: release_assets

        - task: PowerShell@2
          displayName: 'Stage rules zip and release notes'
          inputs:
            targetType: 'inline'
            script: |
              $src = "$(Build.SourcesDirectory)/official_build"
              $dst = "$(Build.SourcesDirectory)/release_assets"
              $version = "$(stageWheels.ReleaseVersion)"

              $rulesZipCandidates = Get-ChildItem $src -Filter "rules.zip" -Recurse
              if (-not $rulesZipCandidates) {
                throw "No rules.zip found under $src. Release requires the official build to publish rules.zip."
              }
              if ($rulesZipCandidates.Count -gt 1) {
                Write-Warning "Found $($rulesZipCandidates.Count) rules.zip files; using the first one"
              }
              $selectedRulesZip = $rulesZipCandidates | Select-Object -First 1
              $rulesZipName = "rules-v$version.zip"
              Copy-Item $selectedRulesZip.FullName -Destination (Join-Path $dst $rulesZipName) -Force

              Write-Host "Using build-produced rules.zip from $($selectedRulesZip.FullName) -> $rulesZipName"
              Write-Host "Staged GitHub release assets:"
              Get-ChildItem $dst | ForEach-Object { Write-Host (" - {0} ({1:N0} bytes)" -f $_.Name, $_.Length) }

              # Extract this version's CHANGELOG section into RELEASE_NOTES.md so the
              # release job (a release job, with no repo checkout) can use it as the
              # release body. It ships inside the GitHubReleaseAssets artifact next to
              # the wheels, and is not matched by the release task's asset globs.
              $changelog = "$(Build.SourcesDirectory)/CHANGELOG.md"
              $notesFile = Join-Path $dst "RELEASE_NOTES.md"
              $utf8WithBom = New-Object System.Text.UTF8Encoding($true)
              if (Test-Path $changelog) {
                $lines = [System.IO.File]::ReadAllLines($changelog, [System.Text.Encoding]::UTF8)
                $start = -1
                for ($i = 0; $i -lt $lines.Count; $i++) {
                  if ($lines[$i] -match "^##\s+WinML CLI v$([regex]::Escape($version))\s*$") { $start = $i; break }
                }
                if ($start -ge 0) {
                  $end = $lines.Count
                  for ($j = $start + 1; $j -lt $lines.Count; $j++) {
                    if ($lines[$j] -match '^##\s') { $end = $j; break }
                  }
                  $section = if ($end -gt ($start + 1)) { $lines[($start + 1)..($end - 1)] } else { @() }
                  [System.IO.File]::WriteAllText($notesFile, (($section -join "`n").Trim() + "`n"), $utf8WithBom)
                  Write-Host "Wrote release notes for v$version to $notesFile"
                } else {
                  Write-Warning "No '## WinML CLI v$version' section in CHANGELOG.md; release notes will be empty"
                  [System.IO.File]::WriteAllText($notesFile, "", $utf8WithBom)
                }
              } else {
                Write-Warning "CHANGELOG.md not found at $changelog; release notes will be empty"
                [System.IO.File]::WriteAllText($notesFile, "", $utf8WithBom)
              }

      - job: CreateGitHubRelease
        displayName: 'Create GitHub Release'
        dependsOn: Prepare
        variables:
          ReleaseVersion: $[ dependencies.Prepare.outputs['stageWheels.ReleaseVersion'] ]
        templateContext:
          type: releaseJob   # Required, this indicates this job is a release job
          isProduction: true # Required, must be 'true' or 'false'
          inputs:
          - input: pipelineArtifact
            artifactName: GitHubReleaseAssets
            targetPath: $(Build.SourcesDirectory)/release_assets

        steps:
        - task: PowerShell@2
          displayName: 'Set release tag'
          inputs:
            targetType: 'inline'
            script: |
              $version = "$(ReleaseVersion)"
              $tag = "v$version"
              Write-Host "Version: $version"
              Write-Host "Tag: $tag"
              Write-Host "##vso[task.setvariable variable=ReleaseTag]$tag"
              # A plain X.Y.Z is a real release; any PEP 440 suffix
              # (e.g. 0.3.0rc1, 0.3.0.dev1, 0.3.0b1) is a pre-release.
              $isPre = if ($version -match '^[0-9]+\.[0-9]+\.[0-9]+$') { 'false' } else { 'true' }
              Write-Host "IsPreRelease: $isPre"
              Write-Host "##vso[task.setvariable variable=IsPreRelease]$isPre"

        - task: GitHubRelease@1
          displayName: 'Create GitHub Release'
          inputs:
            # GitHub App-backed connection; avoids expiring and SAML-bound PAT credentials.
            gitHubConnection: 'microsoft'
            repositoryName: 'microsoft/winml-cli'
            action: create
            target: '$(Build.SourceVersion)'
            tagSource: userSpecifiedTag
            tag: '$(ReleaseTag)'
            title: 'WinML CLI $(ReleaseTag)'
            releaseNotesSource: filePath
            releaseNotesFilePath: '$(Build.SourcesDirectory)/release_assets/RELEASE_NOTES.md'
            assets: |
              $(Build.SourcesDirectory)/release_assets/*.whl
              $(Build.SourcesDirectory)/release_assets/rules-v$(ReleaseVersion).zip
            isDraft: false
            isPreRelease: $(IsPreRelease)
            addChangeLog: false
