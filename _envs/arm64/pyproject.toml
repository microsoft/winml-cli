[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77", "wheel", "tomli>=1.1; python_version < '3.11'"]

[project]
name = "winml-cli"
dynamic = ["version", "readme"]
description = "Accelerate Model Deployment on WinML"
license = "MIT"
requires-python = ">=3.13,<3.14"
classifiers = ["Programming Language :: Python :: 3.13"]
scripts.winml = "winml.modelkit.cli:main"
dependencies = [
  "click>=8.4", "colorama>=0.4.6", "filelock>=3.20", "httpx>=0.24.0",
  "jsonschema>=4.23", "ml-dtypes==0.5.4", "numpy>=2.3.2,<2.4",
  "onnx==1.20.0", "onnxruntime-genai-winml==0.14.1",
  "onnxruntime-windowsml==1.30.1.202610302006", "opentelemetry-sdk>=1.39.1",
  "onnxscript==0.7.2", "optimum==2.1.0", "optimum-onnx==0.1.0", "pandas==3.1.1",
  "plotext>=5.3.2,<6", "psutil>=7", "pydantic>=2", "requests>=2.32.5",
  "rich>=14", "snakemd>=2", "torch==2.9.1+cpu", "torchvision==0.24.1+d801a34",
  "tqdm>=4.67", "transformers==4.57.6", "windowsml[llama]==2.9.36a0",
]

[project.optional-dependencies]
qnn = []

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.15"]

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'ARM64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download-r2.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
